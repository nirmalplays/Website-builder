<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UI Generator logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d0a78" />
      <stop offset="42%" stop-color="#0a0a0f" />
      <stop offset="72%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#4c0f8f" />
    </linearGradient>
    <radialGradient id="glowTL" cx="0.12" cy="0.1" r="0.6">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBR" cx="0.88" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <rect width="512" height="512" fill="url(#glowTL)" />
  <rect width="512" height="512" fill="url(#glowBR)" />

  <g filter="url(#soft)">
    <!-- Two offset bars, cut by a diagonal slash. The gaps are the background. -->
    <path
      fill="#ffffff"
      d="M129 186h81v140l-81 81z"
    />
    <path
      fill="#ffffff"
      d="M129 407v-81l81-81h81v81l-81 81z"
      opacity="0"
    />
    <path fill="#ffffff" d="M129 186h81v198h-81z" />
    <path fill="#ffffff" d="M302 124h81v198h-81z" />
    <!-- Diagonal bar, separated from the verticals by a background-coloured stroke -->
    <g transform="rotate(-45 256 256)">
      <rect x="146" y="214" width="220" height="84" fill="#ffffff" stroke="#15121f" stroke-width="22" />
    </g>
  </g>
</svg>
